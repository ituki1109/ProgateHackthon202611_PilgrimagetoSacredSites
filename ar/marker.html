<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ぬい憑き 標準マーカー</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fff;
        color: #111;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      canvas {
        width: min(90vw, 5cm);
        height: auto;
        border: 1px dashed #aaa;
      }
      @media print {
        .no-print {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="no-print">印刷して切り取り、ぬいの名札にしてください（5cm 角で印刷されます）。別の端末の画面に表示して試すこともできます。</p>
    <canvas id="marker"></canvas>
    <p class="no-print"><a id="download" download="nui-marker.png">PNG で保存</a></p>
    <script type="module">
      import { drawMarker } from './marker.js';
      const canvas = drawMarker(document.getElementById('marker'));
      document.getElementById('download').href = canvas.toDataURL('image/png');
    </script>
  </body>
</html>
