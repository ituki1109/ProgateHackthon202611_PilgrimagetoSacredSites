<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ぬい憑き AR 試作</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="ar"></div>

    <section id="start">
      <h1>ぬい憑き</h1>
      <p>ぬいに付けた名札（マーカー）をカメラで映すと、ぬいに怨念が宿ります。</p>

      <div class="marker-choice">
        <p>マーカーは標準の模様を使います。<a href="./marker.html" target="_blank">表示・印刷する</a></p>
        <label class="file">
          自分の画像をマーカーにする
          <input id="marker-file" type="file" accept="image/*" />
        </label>
        <img id="marker-preview" alt="選んだマーカー" hidden />
      </div>

      <button id="start-button" type="button">はじめる</button>
      <p class="note">カメラを使うので、HTTPS か localhost で開いてください。</p>
    </section>

    <button id="stop-button" type="button" hidden>やめる</button>
    <p id="status" hidden></p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
