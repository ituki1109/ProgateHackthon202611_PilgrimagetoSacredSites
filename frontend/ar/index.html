<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1FA" />
    <title>ぬい憑き AR</title>
    <!-- 色、文字、ボタンはアプリと同じものを使う。このページだけの形は ./style.css に書く -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="ar"></div>

    <section id="start">
      <header class="top-bar">
        <a id="back-link" class="icon-button" href="../#map" aria-label="アプリに戻る">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <h2 id="ar-title" class="top-bar-title">憑依を見る</h2>
      </header>

      <div class="page start-page">
        <div class="profile">
          <p id="nui-line"></p>
          <h1 id="nui-name" class="profile-name">ぬい憑き</h1>
          <p id="nui-grudge" class="profile-meta" hidden></p>

          <button id="start-button" class="button is-primary" type="button">はじめる</button>

          <details class="marker-choice">
            <summary>マーカー</summary>
            <p><a href="./marker.html" target="_blank">標準の名札を表示・印刷する</a></p>
            <label class="file">
              自分の画像を名札にする
              <input id="marker-file" type="file" accept="image/*" />
            </label>
            <img id="marker-preview" alt="選んだマーカー" hidden />
          </details>
        </div>
      </div>
    </section>

    <button id="stop-button" class="button is-small" type="button" hidden>やめる</button>
    <p id="status" hidden></p>
    <p id="debug" hidden></p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
