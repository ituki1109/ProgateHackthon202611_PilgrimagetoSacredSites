<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ぬい憑き AR</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="ar"></div>

    <section id="start">
      <h1 id="nui-name">ぬい憑き</h1>
      <p id="nui-grudge"></p>
      <p id="nui-line"></p>

      <button id="start-button" type="button">はじめる</button>
      <a id="back-link" class="back" href="../#map">アプリに戻る</a>

      <details class="marker-choice">
        <summary>名札（マーカー）</summary>
        <p><a href="./marker.html" target="_blank">標準の名札を表示・印刷する</a></p>
        <label class="file">
          自分の画像を名札にする
          <input id="marker-file" type="file" accept="image/*" />
        </label>
        <img id="marker-preview" alt="選んだマーカー" hidden />
      </details>
    </section>

    <button id="stop-button" type="button" hidden>やめる</button>
    <p id="status" hidden></p>
    <p id="debug" hidden></p>

    <script type="module" src="./main.js"></script>
  </body>
</html>
