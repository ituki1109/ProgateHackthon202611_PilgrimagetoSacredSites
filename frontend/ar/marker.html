<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ぬい憑き 標準マーカー</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #fff;
        color: #111;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      canvas {
        height: auto;
        border: 1px dashed #aaa;
      }
      @media print {
        .no-print {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="no-print">印刷して切り取り、厚紙に貼ってぬいの名札にしてください（<span id="size"></span> 角で印刷されます）。別の端末の画面に表示して試すこともできます。</p>
    <canvas id="marker"></canvas>
    <p class="no-print"><a id="download" download="nui-marker.png">PNG で保存</a></p>
    <p class="no-print"><button id="build" type="button">照合データ（marker.mind）を作る</button></p>
    <script type="module">
      import { MARKER_CM } from './config.js';
      import { compileMarker, createMarkerImage, drawMarker } from './marker.js';
      const canvas = drawMarker(document.getElementById('marker'));
      canvas.style.width = `min(90vw, ${MARKER_CM}cm)`;
      document.getElementById('size').textContent = `${MARKER_CM}cm`;
      document.getElementById('download').href = canvas.toDataURL('image/png');

      // marker.js の模様を変えたら、これで作り直して ar/marker.mind を置き換える
      const build = document.getElementById('build');
      build.addEventListener('click', async () => {
        build.disabled = true;
        const data = await compileMarker(await createMarkerImage(), (p) => {
          build.textContent = `作っています… ${Math.round(p)}%`;
        });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([data]));
        link.download = 'marker.mind';
        link.click();
        build.textContent = '照合データ（marker.mind）を作る';
        build.disabled = false;
      });
    </script>
  </body>
</html>
